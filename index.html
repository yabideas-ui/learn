<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cya Mentor | Cyber Kalari</title>
<meta name="description" content="Cya Mentor - Cyber Kalari course assistant. CCNA, Windows System Admin, CCNP courses in Malayalam.">
<meta name="theme-color" content="#0B1F4B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1F4B; --navy-2:#132B63; --teal:#0B7F85; --bright:#12F2D8; --gold:#FFC83D;
    --bg:#F4F7FB; --ink:#0B1F4B; --muted:#5B6B8C; --line:#DCE3EE; --white:#fff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Manrope","Noto Sans Malayalam",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; justify-content:center;
  }
  .app{width:100%; max-width:720px; height:100dvh; display:flex; flex-direction:column; background:var(--white); box-shadow:0 0 0 1px var(--line)}
  header{
    background:var(--navy); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:12px;
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .logo{
    width:44px; height:44px; border-radius:12px; background:var(--navy-2);
    border:2px solid var(--bright); display:grid; place-items:center;
    font-weight:800; font-size:18px; letter-spacing:-1px; color:#fff; flex:none;
  }
  .logo span{color:var(--bright)}
  .head-text{flex:1; min-width:0}
  .head-text h1{margin:0; font-size:17px; font-weight:800}
  .head-text p{margin:2px 0 0; font-size:12px; color:#B9C6E4}
  .status{display:inline-block; width:8px; height:8px; border-radius:50%; background:#7C8BAA; margin-right:6px; vertical-align:middle}
  .status.on{background:var(--bright)}
  .icon-btn{
    background:transparent; border:1px solid #3A4E80; color:#fff; border-radius:10px;
    height:38px; min-width:38px; padding:0 10px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font:600 12px "Manrope",sans-serif; cursor:pointer;
  }
  .icon-btn[aria-pressed="true"]{background:var(--teal); border-color:var(--teal)}
  .lang-switch{display:flex; border:1px solid #3A4E80; border-radius:10px; overflow:hidden; height:38px; flex:none}
  .lang-switch button{background:transparent; border:none; color:#B9C6E4; padding:0 10px; font:700 12px "Manrope","Noto Sans Malayalam",sans-serif; cursor:pointer}
  .lang-switch button[aria-pressed="true"]{background:var(--bright); color:var(--navy)}
  @media (max-width:420px){ #voiceLabel{display:none} header{gap:8px; padding-left:12px; padding-right:12px} }
  .icon-btn svg{width:18px; height:18px}

  #chat{flex:1; overflow-y:auto; padding:18px 16px 8px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth}
  .msg{max-width:86%; padding:11px 14px; border-radius:16px; line-height:1.55; font-size:15px; white-space:pre-wrap; word-wrap:break-word}
  .msg.agent{background:#EEF3FA; border-top-left-radius:4px; align-self:flex-start}
  .msg.user{background:var(--teal); color:#fff; border-top-right-radius:4px; align-self:flex-end}
  .msg a{color:var(--teal); font-weight:700}
  .msg.user a{color:#fff}
  .msg .wa{
    display:inline-block; margin-top:6px; background:#1FAF55; color:#fff !important; text-decoration:none;
    padding:8px 14px; border-radius:999px; font-weight:700;
  }
  .msg.system{align-self:center; background:transparent; color:var(--muted); font-size:12px; padding:2px 8px; text-align:center}
  .speak-btn{display:block; margin-top:6px; background:none; border:none; color:var(--teal); font:600 12px "Manrope",sans-serif; cursor:pointer; padding:0}
  .typing{align-self:flex-start; display:none; gap:4px; padding:12px 14px; background:#EEF3FA; border-radius:16px}
  .typing.show{display:flex}
  .typing i{width:7px; height:7px; border-radius:50%; background:var(--teal); animation:b 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25; transform:translateY(0)}40%{opacity:1; transform:translateY(-3px)}}

  .welcome{text-align:center; padding:26px 10px 6px}
  .welcome .big-logo{width:72px; height:72px; margin:0 auto 12px; border-radius:20px; font-size:28px}
  .welcome h2{margin:0 0 6px; font-size:20px}
  .welcome p{margin:0; color:var(--muted); font-size:14px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:14px 6px 4px}
  .chip{
    border:1px solid var(--line); background:#fff; color:var(--navy); border-radius:999px;
    padding:8px 14px; font:600 13px "Manrope","Noto Sans Malayalam",sans-serif; cursor:pointer;
  }
  .chip:hover{border-color:var(--teal); color:var(--teal)}

  footer{border-top:1px solid var(--line); padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); background:#fff}
  .row{display:flex; gap:8px; align-items:flex-end}
  textarea{
    flex:1; resize:none; border:1px solid var(--line); border-radius:14px; padding:11px 14px;
    font:15px "Manrope","Noto Sans Malayalam",sans-serif; color:var(--ink); max-height:120px; outline:none; background:#FAFCFF;
  }
  textarea:focus{border-color:var(--teal)}
  .round{
    width:46px; height:46px; border-radius:50%; border:none; display:grid; place-items:center; cursor:pointer; flex:none;
  }
  .round svg{width:21px; height:21px}
  #send{background:var(--teal); color:#fff}
  #send:disabled{opacity:.45; cursor:default}
  #mic{background:#EEF3FA; color:var(--navy)}
  #mic.listening{background:var(--gold); color:var(--navy); animation:p 1.2s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(255,200,61,.6)}100%{box-shadow:0 0 0 12px rgba(255,200,61,0)}}
  .sub{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; font-size:11.5px; color:var(--muted)}
  .sub select{border:1px solid var(--line); border-radius:8px; padding:3px 6px; font:600 11.5px "Manrope",sans-serif; color:var(--navy); background:#fff}
  .sub a{color:var(--teal); font-weight:700; text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">C<span>ക</span></div>
    <div class="head-text">
      <h1>Cya Mentor</h1>
      <p><span class="status" id="dot"></span><span id="statusText"></span></p>
    </div>
    <div class="lang-switch" role="group" aria-label="Language">
      <button id="langEn" aria-pressed="false">EN</button>
      <button id="langMl" aria-pressed="true">മല</button>
    </div>
    <button class="icon-btn" id="voiceToggle" aria-pressed="true" title="Read replies aloud">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="wave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      <span id="voiceLabel"></span>
    </button>
  </header>

  <main id="chat" aria-live="polite">
    <div class="welcome" id="welcome">
      <div class="logo big-logo" aria-hidden="true">C<span>ക</span></div>
      <h2 id="wTitle"></h2>
      <p id="wText"></p>
      <div class="chips" id="chips"></div>
    </div>
    <div class="typing" id="typing"><i></i><i></i><i></i></div>
  </main>

  <footer>
    <div class="row">
      <button class="round" id="mic" title="Speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
      </button>
      <textarea id="input" rows="1" ></textarea>
      <button class="round" id="send" title="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
    <div class="sub">
      <span id="micHint"></span>
      <a href="https://wa.me/918304880336?text=Hi%20Cyber%20Kalari%2C%20I%20have%20a%20course%20enquiry" target="_blank" rel="noopener">WhatsApp +91 83048 80336</a>
    </div>
  </footer>
</div>

<script type="module">
import { Conversation } from "https://esm.sh/@elevenlabs/client@0";

/* ===== Settings ===== */
const AGENT_ID = "agent_5701m7m35cxrfmate1a6y57mfpdr";
const ALLOWED_LINK_HOSTS = ["wa.me", "cyberkalari.com", "www.cyberkalari.com", "skill.cyberkalari.com", "learn.cyberkalari.com"];

/* ===== Elements ===== */
const $ = (id) => document.getElementById(id);
const chat = $("chat"), input = $("input"), send = $("send"), mic = $("mic"), typing = $("typing");
const dot = $("dot"), statusText = $("statusText"), voiceToggle = $("voiceToggle"), voiceLabel = $("voiceLabel");

/* ===== English / Malayalam UI ===== */
const TEXT = {
  en: {
    subtitle: "Cyber Kalari course assistant",
    wTitle: "Hi! I'm Cya Mentor",
    wText: "Ask me anything about the CCNA, Windows System Admin and CCNP courses.<br>Type, or tap the mic and speak.",
    chips: ["Which course is right for me?", "Tell me about the CCNA course", "Windows System Admin course", "What is the difference between Standard and Pro?"],
    placeholder: "Type your question in English or Malayalam",
    micHint: "Mic: English (India)",
    voiceOn: "Voice on", voiceOff: "Voice off", play: "Play",
    connecting: "Connecting...", online: "Online", offline: "Offline",
    noMl: "This device has no Malayalam voice. Please read the reply as text.",
    noMic: "Voice input is not supported in this browser. Please use Chrome or type.",
    micPerm: "Please allow microphone access in your browser settings.",
    connErr: "Connection problem. Please try again, or message us on WhatsApp.",
    noConnect: "Could not connect to Cya Mentor. Please message us on WhatsApp: +91 83048 80336",
    first: "Hi, I'm Cya Mentor, the Cyber Kalari course assistant. Ask me anything about the CCNA, Windows System Admin or CCNP courses. What's your name?",
    agentLang: "en", micLang: "en-IN",
  },
  ml: {
    subtitle: "Cyber Kalari course assistant",
    wTitle: "നമസ്കാരം! ഞാൻ Cya Mentor",
    wText: "CCNA, Windows System Admin, CCNP courses-നെ കുറിച്ച് എന്തും ചോദിക്കാം.<br>Type ചെയ്യാം, അല്ലെങ്കിൽ mic-ൽ സംസാരിക്കാം.",
    chips: ["എനിക്ക് പറ്റിയ course ഏതാണ്?", "CCNA course-നെ കുറിച്ച് പറയാമോ?", "Windows System Admin course", "Standard-ഉം Pro-യും തമ്മിലുള്ള വ്യത്യാസം?"],
    placeholder: "ചോദ്യം Malayalam-ലോ English-ലോ type ചെയ്യൂ",
    micHint: "Mic: മലയാളം",
    voiceOn: "Voice on", voiceOff: "Voice off", play: "കേൾക്കുക",
    connecting: "Connect ചെയ്യുന്നു...", online: "Online", offline: "Offline",
    noMl: "ഈ device-ൽ Malayalam voice ഇല്ല. Reply text ആയി വായിക്കാം.",
    noMic: "ഈ browser-ൽ mic support ഇല്ല. Chrome ഉപയോഗിക്കൂ, അല്ലെങ്കിൽ type ചെയ്യൂ.",
    micPerm: "Mic permission വേണം. Browser settings-ൽ allow ചെയ്യൂ.",
    connErr: "Connection പ്രശ്നം. വീണ്ടും ശ്രമിക്കൂ, അല്ലെങ്കിൽ WhatsApp-ൽ message ചെയ്യൂ.",
    noConnect: "Cya Mentor-ലേക്ക് connect ചെയ്യാൻ പറ്റിയില്ല. WhatsApp-ൽ message ചെയ്യൂ: +91 83048 80336",
    first: "നമസ്കാരം, ഞാൻ Cya Mentor, Cyber Kalari-യുടെ course assistant. CCNA, Windows System Admin, CCNP courses-നെ കുറിച്ച് എന്തും ചോദിക്കാം. നിങ്ങളുടെ പേര് എന്താ?",
    agentLang: "ml", micLang: "ml-IN",
  },
};
let lang = "ml";
try { const saved = localStorage.getItem("cyaLang"); if (saved === "en" || saved === "ml") lang = saved; } catch {}
const T = (k) => TEXT[lang][k];

function applyLang(){
  document.documentElement.lang = lang;
  $("langEn").setAttribute("aria-pressed", String(lang === "en"));
  $("langMl").setAttribute("aria-pressed", String(lang === "ml"));
  if (!conversation) statusText.textContent = T("subtitle");
  input.placeholder = T("placeholder");
  $("micHint").textContent = T("micHint");
  voiceLabel.textContent = voiceOn ? T("voiceOn") : T("voiceOff");
  if ($("welcome")) {
    $("wTitle").textContent = T("wTitle");
    $("wText").innerHTML = T("wText");
    const chips = $("chips"); chips.innerHTML = "";
    T("chips").forEach(c => {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = c; b.onclick = () => sendText(c);
      chips.appendChild(b);
    });
  }
}
function setLang(l){
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem("cyaLang", l); } catch {}
  applyLang();
  // An ongoing chat continues: the agent replies in whatever language the student types.
}

let conversation = null;
let connecting = null;
let voiceOn = true;
let pending = [];

/* ===== Helpers ===== */
const MALAYALAM = /[ഀ-ൿ]/;
function setStatus(on, text){ dot.classList.toggle("on", on); statusText.textContent = text; }
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function renderMarkdown(text){
  let html = escapeHtml(text);
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, label, url) => {
    try {
      const u = new URL(url.replace(/&amp;/g, "&"));
      if (!ALLOWED_LINK_HOSTS.includes(u.hostname)) return label;
      const cls = u.hostname === "wa.me" ? ' class="wa"' : "";
      return `<a${cls} href="${escapeHtml(u.href)}" target="_blank" rel="noopener">${label}</a>`;
    } catch { return label; }
  });
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return html;
}
function plainForSpeech(text){
  return text
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
    .replace(/https?:\/\/\S+/g, "")
    .replace(/[*_#`>]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function addMessage(role, text){
  $("welcome")?.remove();
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  if (role === "agent") {
    div.innerHTML = renderMarkdown(text);
    if (speechSynthesis) {
      const b = document.createElement("button");
      b.className = "speak-btn"; b.textContent = T("play");
      b.onclick = () => speak(text, true);
      div.appendChild(b);
    }
  } else {
    div.textContent = text;
  }
  chat.insertBefore(div, typing);
  scrollDown();
}
function addSystem(text){
  const div = document.createElement("div");
  div.className = "msg system"; div.textContent = text;
  chat.insertBefore(div, typing); scrollDown();
}

/* ===== Free device voice (text-to-speech) ===== */
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function pickVoice(lang){
  const l = lang.toLowerCase();
  const exact = voices.filter(v => v.lang.toLowerCase().replace("_","-") === l);
  const prefix = voices.filter(v => v.lang.toLowerCase().startsWith(l.split("-")[0]));
  const pool = exact.length ? exact : prefix;
  const female = pool.find(v => /female|woman|heera|veena|neerja|swara|sangeeta/i.test(v.name));
  return female || pool.find(v => /google/i.test(v.name)) || pool[0] || null;
}

let warnedNoMl = false;
function speak(text, force = false){
  if (!window.speechSynthesis || (!voiceOn && !force)) return;
  const clean = plainForSpeech(text);
  if (!clean) return;
  speechSynthesis.cancel();
  const isMl = MALAYALAM.test(clean);
  let voice = pickVoice(isMl ? "ml-IN" : "en-IN") || (!isMl ? pickVoice("en-GB") || pickVoice("en-US") : null);
  if (isMl && !voice) {
    if (!warnedNoMl) { addSystem(T("noMl")); warnedNoMl = true; }
    return;
  }
  // Split into short chunks: some browsers stop long utterances midway.
  const parts = clean.match(/[^.!?।]+[.!?।]?/g) || [clean];
  parts.forEach(p => {
    const u = new SpeechSynthesisUtterance(p.trim());
    if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = isMl ? "ml-IN" : "en-IN"; }
    u.rate = 1; u.pitch = 1.05;
    speechSynthesis.speak(u);
  });
}

voiceToggle.onclick = () => {
  voiceOn = !voiceOn;
  voiceToggle.setAttribute("aria-pressed", String(voiceOn));
  voiceLabel.textContent = voiceOn ? T("voiceOn") : T("voiceOff");
  if (!voiceOn && window.speechSynthesis) speechSynthesis.cancel();
};

/* ===== Agent connection (text-only = low cost) ===== */
async function ensureConnected(){
  if (conversation) return conversation;
  if (connecting) return connecting;
  setStatus(false, T("connecting"));
  connecting = Conversation.startSession({
    agentId: AGENT_ID,
    connectionType: "websocket",
    textOnly: true,
    overrides: { conversation: { textOnly: true }, agent: { language: T("agentLang"), firstMessage: T("first") } },
    onConnect: () => setStatus(true, T("online")),
    onDisconnect: () => { conversation = null; connecting = null; setStatus(false, T("subtitle")); typing.classList.remove("show"); },
    onError: (e) => { console.error(e); addSystem(T("connErr")); typing.classList.remove("show"); },
    onMessage: (m) => {
      const role = m.role || m.source;
      if (role === "agent" || role === "ai") {
        typing.classList.remove("show");
        addMessage("agent", m.message);
        speak(m.message);
      }
    },
  }).then(c => { conversation = c; connecting = null; return c; })
    .catch(err => { connecting = null; setStatus(false, T("offline")); throw err; });
  return connecting;
}

async function sendText(text){
  text = text.trim();
  if (!text) return;
  if (window.speechSynthesis) speechSynthesis.cancel();
  addMessage("user", text);
  input.value = ""; autosize(); send.disabled = true;
  typing.classList.add("show"); scrollDown();
  try {
    const c = await ensureConnected();
    c.sendUserMessage(text);
  } catch (e) {
    console.error(e);
    typing.classList.remove("show");
    addSystem(T("noConnect"));
  }
}

/* ===== Input ===== */
function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; }
input.addEventListener("input", () => { autosize(); send.disabled = !input.value.trim(); });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(input.value); } });
send.onclick = () => sendText(input.value);
$("langEn").onclick = () => setLang("en");
$("langMl").onclick = () => setLang("ml");

/* ===== Free device mic (speech-to-text) ===== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (!SR) {
  mic.title = "Voice input not supported in this browser. Please type.";
  mic.style.opacity = .4;
}
mic.onclick = () => {
  if (!SR) { addSystem(T("noMic")); return; }
  if (listening) { rec.stop(); return; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  rec = new SR();
  rec.lang = T("micLang");
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  let finalText = "";
  rec.onstart = () => { listening = true; mic.classList.add("listening"); };
  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t; else interim += t;
    }
    input.value = (finalText + interim).trim(); autosize(); send.disabled = !input.value.trim();
  };
  rec.onerror = (e) => { if (e.error === "not-allowed") addSystem(T("micPerm")); };
  rec.onend = () => {
    listening = false; mic.classList.remove("listening");
    if (finalText.trim()) sendText(finalText);
  };
  rec.start();
};

applyLang();

window.addEventListener("beforeunload", () => { if (conversation) conversation.endSession(); });
</script>
</body>
</html>
