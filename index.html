<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://ekanthi-tutor.yabideas.workers.dev; frame-src 'self' blob: data: about:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b2239">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Ekanthi — Learning & Coaching</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#1b2230;--muted:#667085;--line:#e4e2db;--brand:#1f4e79;--brand2:#2b6aa3;--soft:#e8eff7;--ok:#1f8a5b;--okbg:#e6f4ec;--warn:#b7791f;--warnbg:#fdf3dc;--bad:#b23a3a;--badbg:#fbe9e9;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Malayalam",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
a{color:var(--brand2)}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12.5px}
h1,h2,h3{margin:0}
h2{font-size:16px}
h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.btn{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid #c9d6e5}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #e6bcbc}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px #dbe7f3}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:13px;font-weight:600;color:#3b4456;margin-bottom:5px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.p0{background:#eef0f3;color:#5b6474}.p1{background:var(--warnbg);color:#8a5a00}.p2{background:var(--okbg);color:#16683f}.p3{background:var(--soft);color:var(--brand)}
.pr-A{background:#fde8e8;color:#9b2c2c}.pr-B{background:#fdf3dc;color:#8a5a00}.pr-C{background:#e8eef7;color:#2c4a75}
.alert{background:var(--badbg);color:var(--bad)}
.good{background:var(--okbg);color:#16683f}
.bar{height:8px;background:#ebe9e3;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--brand2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;background:#faf9f6}
tr.click{cursor:pointer}tr.click:hover td{background:#f7f9fc}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b2230;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #c9d6e5;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#1f4e79 0%,#183d5f 55%,#f5f4ef 55%)}
.login-box{width:100%;max-width:400px}
.brand{color:#fff;text-align:center;margin-bottom:18px}
.brand .logo{font-size:34px;font-weight:800;letter-spacing:.01em}
.brand .tag{opacity:.85;font-size:14px}
.seg{display:flex;background:#eef0f3;border-radius:10px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.err{color:var(--bad);font-size:13px;min-height:18px}
/* student */
#student{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:80px}
.s-head{background:var(--brand);color:#fff;padding:16px 16px 18px;border-radius:0 0 18px 18px}
.s-head .hi{font-size:20px;font-weight:800}
.s-head .sub{opacity:.85;font-size:13px}
.s-head .icon{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer}
.s-main{padding:14px}
.navbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.navbar .in{display:flex;max-width:560px;width:100%}
.navbar button{flex:1;border:0;background:transparent;padding:10px 4px 9px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.navbar button svg{width:22px;height:22px}
.navbar button.on{color:var(--brand)}
.streak{display:flex;gap:12px;align-items:center}
.streak .n{font-size:30px;font-weight:800;color:var(--brand)}
.task{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.task .dot{width:26px;height:26px;border-radius:50%;border:2px solid #c9d6e5;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.task.done .dot{background:var(--ok);border-color:var(--ok)}
.task .t{font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.exam{flex:1;min-width:100px;border-radius:12px;padding:10px 12px;color:#fff}
.exam b{display:block;font-size:20px;white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.days span{aspect-ratio:1;border-radius:5px;background:#e9e7e0}
.days span.on{background:var(--ok)}
.days span.today{outline:2px solid var(--brand2);outline-offset:1px}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.q .qt{font-weight:700;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:7px;cursor:pointer;background:#fff}
.opt.sel{border-color:var(--brand2);background:var(--soft)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt .l{font-weight:800;color:var(--muted);width:18px;flex:none}
.explain{margin-top:10px;font-size:14px;background:#f7f6f2;border-radius:10px;padding:10px 12px}
.score{font-size:42px;font-weight:800;color:var(--brand)}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:380px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 10px}
.msg{max-width:86%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.55;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.m{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;color:var(--muted);font-size:12px;text-align:center;background:none}
.msg .say{background:none;border:0;color:var(--brand2);font-size:12px;font-weight:700;cursor:pointer;padding:4px 0 0}
.composer{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px}
.composer textarea{border:0;min-height:40px;max-height:110px;resize:none;box-shadow:none!important;padding:8px}
.composer button{border:0;border-radius:10px;padding:0 12px;cursor:pointer;background:var(--soft);color:var(--brand);font-size:17px}
.composer .send{background:var(--brand);color:#fff;font-size:14px;font-weight:700}
.rec{background:var(--badbg)!important;color:var(--bad)!important;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.wa{background:#25D366;color:#fff;border:0;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;text-decoration:none}
/* tutor */
#tutor{min-height:100vh}
.t-head{background:var(--brand);color:#fff}
.t-head .in{max-width:1180px;margin:0 auto;padding:14px 20px 0}
.t-head .logo{font-size:20px;font-weight:800}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.tabs button{border:0;background:transparent;color:#cfdced;font-weight:700;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--bg);color:var(--brand)}
.t-main{max-width:1180px;margin:0 auto;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi b{display:block;font-size:28px;font-weight:800;margin-top:4px}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:13px}
.subtabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal>div{border-radius:8px;padding:6px;min-height:58px;background:#f1efe9;font-size:11.5px}
.cal>div .d{font-weight:700;color:var(--muted)}
.cal>div.l1{background:#dcefe3}.cal>div.l2{background:#b5dfc4}.cal>div.l3{background:#7cc79a}
.cal>div.fut{background:transparent;border:1px dashed var(--line)}
.creds{background:var(--okbg);border:1px solid #bfe3cd;border-radius:12px;padding:14px}
.creds code{font-size:18px;font-weight:800;background:#fff;padding:2px 8px;border-radius:6px}
.scroll{overflow-x:auto}
.inline input,.inline select{padding:6px 8px;border-radius:8px}
.seg4 button{font-size:12.5px;padding:8px 4px}
.qcard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px}
.qcard .qh{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.model{background:#f3f7fb;border:1px solid #d9e5f1;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs div{position:relative}
.thumbs img{width:72px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:12px;cursor:pointer}
.sec-h{margin:18px 0 8px;font-weight:800;color:var(--brand)}
.anal li{margin:4px 0}
.mark-in{width:70px!important;display:inline-block}
.upl{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.notes{font-size:14.5px;line-height:1.6}
.notes .nh{display:block;font-weight:800;color:var(--brand);margin:12px 0 4px;font-size:15px}
.mat{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px}
.mat .mt{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mat .ic{width:34px;height:34px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.mat img.full{width:100%;max-height:640px;object-fit:contain;background:#faf9f6;border-radius:10px;margin-top:10px;border:1px solid var(--line)}
.chrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.dotnew{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.vizbox{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;margin:8px 0;text-align:left;max-width:900px}
.vizbox iframe{width:100%;aspect-ratio:8/5;border:0;border-radius:8px;background:#fff;display:block}
.vizbox:fullscreen{padding:20px;overflow:auto}.vizbox:fullscreen iframe{height:80vh;aspect-ratio:auto}
.vizbox ol{margin:8px 0 0 18px;padding:0}
.quick button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;font-weight:700;font-size:13px;cursor:pointer}
.hw{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.hw.over{border-color:#e6bcbc;background:#fffafa}
.timer-bar{position:sticky;top:0;z-index:6}
/* report */
#report{max-width:820px;margin:0 auto;padding:16px}
.rp-head{background:var(--brand);color:#fff;border-radius:16px;padding:18px}
.rp-status{border-radius:16px;padding:18px;display:flex;gap:14px;align-items:center}
.rp-status .big{font-size:40px;line-height:1}
.rp-green{background:#e6f4ec;color:#145c37}.rp-amber{background:#fdf3dc;color:#7a4f00}.rp-red{background:#fbe9e9;color:#8f2a2a}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:24px;margin-top:2px}
.tile .ml{font-size:12px;color:var(--muted)}
.al{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;font-size:14px}
.al.red{background:var(--badbg);color:#8f2a2a}.al.amber{background:var(--warnbg);color:#7a4f00}
.subj-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;border-top:4px solid var(--brand2)}
.trend-up{color:var(--ok);font-weight:800}.trend-down{color:var(--bad);font-weight:800}
.tc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.tc-ch{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.tc-ch.done{background:var(--okbg);border-color:#bfe3cf}.tc-ch.on{outline:3px solid var(--brand2);outline-offset:1px}
.tc-notes{line-height:1.6}.tc-notes.big{font-size:21px;line-height:1.7}
.pl-row{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.pl-date{width:86px;flex:none;font-size:12.5px;color:var(--muted);font-weight:700}
.pl-item{display:inline-flex;align-items:center;gap:6px;font-size:13px;border-radius:8px;padding:3px 8px;margin:2px;background:#f3f5f8;border-left:3px solid #2b6aa3}
.pl-item.exam{background:var(--badbg);border-left-color:var(--bad);font-weight:700}
.pl-item.mock{background:#fff4e5}.pl-item.revise{background:#eef7f1}
.pl-check{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:14px}
.pl-check.done{opacity:.6;text-decoration:line-through}
.badge{display:inline-block;background:#fff6dd;border:1px solid #f1dfa6;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700;margin:2px}
@media print{.noprint,.navbar{display:none!important} body{background:#fff}}
/* ===== premium theme ===== */
:root{--bg:#f3f5f9;--ink:#0f1b2d;--muted:#5d6b82;--line:#e3e8f0;--brand:#143a5e;--brand2:#2563a6;--gold:#f2b632;--gold2:#ffd36b;--navy:#0b2239;--r:18px;--shadow:0 1px 2px rgba(15,27,45,.04),0 8px 24px rgba(15,27,45,.06)}
body{background:radial-gradient(1200px 500px at 50% -200px,#e4ecf7 0%,var(--bg) 60%) fixed;letter-spacing:-.005em}
.card{border:1px solid rgba(20,58,94,.07);box-shadow:var(--shadow)}
h2{font-size:17px;letter-spacing:-.01em}
.btn{background:linear-gradient(180deg,#1d4f80,#143a5e);box-shadow:0 2px 0 rgba(0,0,0,.06),0 6px 14px rgba(20,58,94,.22);border-radius:12px;transition:transform .08s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;box-shadow:none;border:1px solid #cfdcec}
.btn.danger{background:#fff;box-shadow:none}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1d00;box-shadow:0 6px 16px rgba(242,182,50,.35)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bar{background:#e8edf4}.bar>span{background:linear-gradient(90deg,#2563a6,#3f8fe0)}
/* login */
#login{background:radial-gradient(700px 420px at 15% 10%,#2d6db0 0%,transparent 60%),radial-gradient(600px 400px at 90% 90%,#7a5a12 0%,transparent 55%),linear-gradient(160deg,#0b2239 0%,#123a60 60%,#0b2239 100%)}
.brand .mark{width:64px;height:64px;margin:0 auto 10px;border-radius:20px;background:linear-gradient(145deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#0b2239;box-shadow:0 10px 30px rgba(242,182,50,.35)}
.brand .logo{font-size:40px;letter-spacing:-.02em}
.brand .tag{color:#d8e4f2}
#login .card{background:rgba(255,255,255,.97);border:0;box-shadow:0 30px 80px rgba(0,0,0,.35);border-radius:22px;padding:20px}
.intro-link{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:11px;font-weight:700;cursor:pointer;width:100%;font-size:14px}
/* student */
.s-head{background:radial-gradient(500px 200px at 90% 0%,rgba(242,182,50,.28),transparent 60%),linear-gradient(150deg,#0b2239,#1d4f80);padding:18px 18px 22px;border-radius:0 0 26px 26px;box-shadow:0 10px 30px rgba(11,34,57,.25)}
.s-head .hi{font-size:22px;letter-spacing:-.01em}
.s-head .icon{backdrop-filter:blur(6px)}
.navbar{background:rgba(255,255,255,.88);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid rgba(20,58,94,.08)}
.navbar button.on{color:var(--brand)}
.navbar button.on svg{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#0b2239;border-radius:10px;padding:3px;width:30px;height:28px;margin-top:-4px}
.access{display:flex;gap:10px;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#fff6df,#fffaf0);border:1px solid #f5dc9b;border-radius:16px;padding:12px 14px;font-size:14px}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line)}
.lb-row:last-child{border:0}
.lb-rank{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:#eef2f7;color:var(--brand)}
.lb-row.r1 .lb-rank{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#3a2a00}

var token = ls(TOKEN_KEY), role = ls(ROLE_KEY);
var $ = function(id){ return document.getElementById(id); };

function fmtDT(d){ if(!d) return "—"; var t=new Date(d); return t.toLocaleDateString("en-IN",{day:"numeric",month:"short"})+" "+t.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}); }
function addDays(d,n){ var t=new Date(d+"T00:00:00Z"); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00Z")-new Date(a+"T00:00:00Z"))/86400000); }
function pct(a,b){ return b? Math.round(a*100/b) : 0; }
function md(t){ var h=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); return h.split("\n").map(function(l){ if(/^\s*#{1,4}\s+/.test(l)) return '<span class="nh">'+l.replace(/^\s*#{1,4}\s+/,"")+'</span>'; return /^\s*[-*]\s+/.test(l)? "• "+l.replace(/^\s*[-*]\s+/,"") : l; }).join("<br>").replace(/<\/span><br>/g,"</span>"); }

  var br=/Edg\//.test(ua)?"Edge":/SamsungBrowser/.test(ua)?"Samsung":/Chrome\//.test(ua)?"Chrome":/Firefox\//.test(ua)?"Firefox":/Safari\//.test(ua)?"Safari":""; return os+(br?" · "+br:""); }

function api(path, body){
  var opt = {method: body===undefined?"GET":"POST", headers:{}};
  if(token) opt.headers.Authorization = "Bearer "+token;
  opt.headers["X-App-Version"]=String(APP_VERSION);
  if(body!==undefined){ opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
  return fetch(API_URL+path, opt).then(function(r){
    return r.json().catch(function(){return {};}).then(function(d){
      if(r.status===426){ appUpdate(true); }

// ----- app install (PWA) + push notifications -----

function keyBytes(k){ k=k.replace(/-/g,"+").replace(/_/g,"/"); k+= "=".repeat((4-k.length%4)%4); var r=atob(k), a=new Uint8Array(r.length); for(var i=0;i<r.length;i++) a[i]=r.charCodeAt(i); return a; }

  return navigator.serviceWorker.ready.then(function(reg){

}
function qBlock(qs, ans, done, k){
  return qs.map(function(q,i){
    var h='<div class="q"><div class="muted small">Q'+(i+1)+(q.chapter?' · '+esc(q.chapter):'')+'</div><div class="qt">'+esc(q.q).replace(/\n/g,"<br>")+'</div>';
    q.options.forEach(function(o,j){ var c='opt'; if(done){ if(j===q.answer) c+=' right'; else if(j===q.chosen) c+=' wrong'; } else if(ans[i]===j) c+=' sel';
      h+='<div class="'+c+'" data-k="'+k+'" data-q="'+i+'" data-o="'+j+'"><span class="l">'+"ABCD"[j]+'</span><span>'+esc(o)+'</span></div>'; });
    if(done && q.explain) h+='<div class="explain">'+(q.chosen===q.answer?'✓ ':'✗ ')+esc(q.explain)+'</div>';
    return h+'</div>'; }).join("");
}
function scoreCard(score,total,extra){ var p=pct(score,total); return '<div class="card" style="text-align:center"><h3>Score</h3><div class="score">'+score+' / '+total+'</div><div class="pill '+(p>=60?'good':p>=40?'p1':'alert')+'">'+p+'%</div><div class="muted" style="margin-top:8px">'+(p>=80?"മികച്ചത്! Excellent!":p>=60?"നല്ലത്! Good work.":p>=40?"കുറച്ചുകൂടി practice ചെയ്യാം.":"Don't worry — read the explanations below and ask Ekanthi Agent.")+'</div>'+(extra||'')+'</div>'; }
function renderQuiz(){
  var done=Q.completed, h=segHtml();
  h+= done? scoreCard(Q.score,Q.total,'<div class="muted small" style="margin-top:6px">New quiz tomorrow.</div>') : '<div class="card"><h2>Daily quiz</h2><div class="muted">'+Q.total+' questions · choose one answer each</div></div>';
  h+=qBlock(Q.questions,qAns,done,"d");

  if(past.length) h+='<div class="card stack"><h3>Recent daily scores</h3>'+past.map(function(q){return '<div class="row between"><span>'+fmtDate(q.date)+'</span><b>'+q.score+'/'+q.total+'</b></div>';}).join("")+'</div>';

function fmtSecs(n){ n=n||0; return Math.floor(n/60)+":"+String(n%60).padStart(2,"0"); }
function renderPractice(){

    '<div><label class="f">Chapters (choose 1–4)</label>'+(chs.length? '<div class="stack" id="pChaps">'+chs.map(function(c){ var on=pSel.chapters.indexOf(c.id)>=0; return '<label class="opt'+(on?' sel':'')+'" style="margin:0"><input type="checkbox" data-id="'+c.id+'"'+(on?' checked':'')+' style="margin-top:3px"><span>'+esc(c.name)+' <span class="pill p'+c.status+'" style="margin-left:4px">'+STATUS[c.status]+'</span></span></label>'; }).join("")+'</div>' : '<div class="muted">No chapters yet. Ask your tutor.</div>')+'</div>'+
    '<div><label class="f">Number of questions</label><div class="chips" id="pN">'+[10,15,20].map(function(n){return '<button class="chip'+(n===pSel.n?' on':'')+'" data-n="'+n+'">'+n+' questions</button>';}).join("")+'</div></div>'+
    '<button class="btn block" id="pStartBtn"'+(pSel.chapters.length?'':' disabled')+'>Start test</button></div>';
  var hist=(S.practice||[]);

function startPractice(){

}
$("sv-quiz").addEventListener("click", function(e){
  var m=e.target.closest(".seg button"); if(m){ qMode=m.dataset.m; clearInterval(pTimer); clearInterval(mTimer); loadQuiz(); return; }
  if(qMode==="imp" && impClick(e)) return;
  if(qMode==="mock" && mockClick(e)) return;
  if(e.target.id==="qRetry"){ loadQuiz(); return; }
  var o=e.target.closest(".opt[data-k]");
  if(o){ var qi=Number(o.dataset.q), oi=Number(o.dataset.o);
    if(o.dataset.k==="d" && Q && !Q.completed){ qAns[qi]=oi; renderQuiz(); }
    if(o.dataset.k==="p" && P && !P.completed){ pAns[qi]=oi; o.parentNode.querySelectorAll(".opt").forEach(function(x){ x.classList.toggle("sel", x===o); }); }
    return; }
  if(e.target.id==="qSubmit"){
    var miss=qAns.filter(function(a){return a<0;}).length; if(miss && !confirm(miss+" question(s) not answered. Submit anyway?")) return;
    e.target.disabled=true;
    api("/api/quiz/submit",{id:Q.id, answers:qAns}).then(function(d){ Q=d; renderQuiz(); window.scrollTo(0,0); return loadMe(); }).catch(function(er){ toast(er.message); e.target.disabled=false; });
    return; }
  var sb=e.target.closest("#pSubj button"); if(sb){ pSel.subject=Number(sb.dataset.id); pSel.chapters=[]; renderPractice(); return; }
  var nb=e.target.closest("#pN button"); if(nb){ pSel.n=Number(nb.dataset.n); renderPractice(); return; }
  if(e.target.closest("#pStartBtn")){ startPractice(); return; }
  if(e.target.id==="pSubmit"){
    var miss2=pAns.filter(function(a){return a<0;}).length; if(miss2 && !confirm(miss2+" question(s) not answered. Submit anyway?")) return;
    e.target.disabled=true; clearInterval(pTimer); focusSend();
    api("/api/practice/submit",{id:P.id, answers:pAns, seconds:Math.round((Date.now()-pStart)/1000)}).then(function(d){ P=d; renderPractice(); window.scrollTo(0,0); return loadMe(); }).catch(function(er){ toast(er.message); e.target.disabled=false; });
    return; }
  if(e.target.id==="pQuit"){ focusPause(); P=null; clearInterval(pTimer); loadMe().then(renderPractice); return; }
  if(e.target.id==="pAgain"){ P=null; startPractice(); return; }
  if(e.target.id==="pNew"){ P=null; renderPractice(); return; }
  var hr=e.target.closest("[data-pid]"); if(hr){ api("/api/practice/open?id="+hr.dataset.pid).then(function(d){ P=d; if(!d.completed){ pAns=d.questions.map(function(){return -1;}); pStart=Date.now(); } renderPractice(); window.scrollTo(0,0); }).catch(function(er){ toast(er.message); }); }
});
$("sv-quiz").addEventListener("change", function(e){

  var cb=e.target; if(cb.type!=="checkbox" || !cb.dataset.id) return;

});

// ----- student: app usage heartbeat + focus tracking during timed tests -----
var beatTimer=null, lastBeat=0, FT=null;
function beat(start){ if(role!=="student"||!token) return; if(!start) hwCheck(); var now=Date.now(), sec=start?0:Math.min(90,Math.round((now-lastBeat)/1000)); lastBeat=now; api("/api/ping",{start:!!start, view:sView, sec:sec}).catch(function(){}); }
function startBeat(){ clearInterval(beatTimer); lastBeat=Date.now(); beat(true); beatTimer=setInterval(function(){ if(document.visibilityState==="visible") beat(false); else lastBeat=Date.now(); },60000); }
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible" && role==="student" && token && S) hwCheck();
  if(role!=="student") return;
  if(document.visibilityState==="hidden"){ beat(false); if(FT){ FT.leaves++; FT.hiddenAt=Date.now(); } }
  else { lastBeat=Date.now(); if(FT && FT.hiddenAt){ FT.away+=Math.round((Date.now()-FT.hiddenAt)/1000); FT.hiddenAt=0; } }
});
function focusStart(kind, ref, title){ if(FT && FT.kind===kind && FT.ref===ref) return; var saved=null; try{ saved=JSON.parse(localStorage.getItem("ek_focus_"+kind+"_"+ref)||"null"); }catch(e){} FT=saved||{kind:kind, ref:ref, title:title, leaves:0, away:0, hiddenAt:0}; }
function focusSave(){ if(FT) try{ localStorage.setItem("ek_focus_"+FT.kind+"_"+FT.ref, JSON.stringify(FT)); }catch(e){} }
setInterval(focusSave, 15000);
function focusSend(){ if(!FT) return; var f=FT; FT=null; try{ localStorage.removeItem("ek_focus_"+f.kind+"_"+f.ref); }catch(e){} api("/api/focus",{kind:f.kind, ref_id:f.ref, title:f.title, leaves:f.leaves, away_sec:f.away}).catch(function(){}); }
function focusPause(){ focusSave(); FT=null; }

function compressImage(file){ return new Promise(function(res,rej){ var img=new Image(), url=URL.createObjectURL(file);
  img.onload=function(){ var max=1400, sc=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);

  img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error("Could not read photo")); }; img.src=url; }); }

function lineChart(pts){

  [0,50,100].forEach(function(v){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#ebe9e3"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" font-size="10" fill="#667085" text-anchor="end">'+v+'%</text>'; });
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(33)+'" y2="'+y(33)+'" stroke="#b23a3a" stroke-dasharray="4 4"/>';
  s+='<polyline fill="none" stroke="#2b6aa3" stroke-width="2.5" points="'+pts.map(function(p,i){return x(i)+','+y(p.y);}).join(" ")+'"/>';
  pts.forEach(function(p,i){ s+='<circle cx="'+x(i)+'" cy="'+y(p.y)+'" r="3.5" fill="#fff" stroke="#2b6aa3" stroke-width="2"><title>'+esc(p.x)+': '+p.y+'%</title></circle>'; if(n<=8||i%2===0) s+='<text x="'+x(i)+'" y="'+(H-8)+'" font-size="10" fill="#667085" text-anchor="middle">'+esc(p.x)+'</text>'; });
  return s+'</svg>';
}

var LANG_OPTS=[['ml','Malayalam + English'],['hi','Hindi + English'],['en','English only']];
var T={view:"students", overview:null, detail:null, dTab:"dash", classes:null, clsSel:null, newCreds:null, adding:false};
$("tLogout").addEventListener("click",function(){ logout(); });
$("tTabs").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return; tGo(b.dataset.t); });
function tGo(v, id){
  T.view=v; document.querySelectorAll("#tTabs button").forEach(function(x){x.classList.toggle("on", x.dataset.t===(v==="detail"?"students":v));});
  if(v==="students") loadOverview(); if(v==="classes") loadClasses(); if(v==="study") loadStudyMgr(); if(v==="homework") loadHwMgr(); if(v==="plans") loadPlans(); if(v==="teach") loadTeach(); if(v==="live") loadLive(); if(v==="board") loadBoard(); if(v==="detail") loadDetail(id);
  window.scrollTo(0,0);
}
function loading(){ $("tMain").innerHTML='<div class="card empty"><span class="spinner"></span></div>'; }
function loadOverview(){ loading(); api("/api/admin/overview").then(function(d){ T.overview=d; $("tToday").textContent="Today: "+fmtDate(d.today); renderOverview(); }).catch(showErr); }
function showErr(e){ $("tMain").innerHTML='<div class="card empty">'+esc(e.message)+'</div>'; }

function renderOverview(){
  var d=T.overview, st=d.students, act=st.filter(function(s){return s.active;});
  var today=act.filter(function(s){return s.lastActive===d.today;}).length, att=act.filter(function(s){return s.alerts.length;}).length;
  var qa=act.filter(function(s){return s.quizAvg7!==null;}), avg=qa.length? Math.round(qa.reduce(function(a,s){return a+s.quizAvg7;},0)/qa.length) : null;
  var h='<div class="kpis"><div class="card kpi"><h3>Active students</h3><b>'+act.length+'</b></div><div class="card kpi"><h3>Studied today</h3><b>'+today+'</b></div><div class="card kpi"><h3>Need attention</h3><b style="color:'+(att?'var(--bad)':'inherit')+'">'+att+'</b></div><div class="card kpi"><h3>Avg quiz (7 days)</h3><b>'+(avg===null?'—':avg+'%')+'</b></div></div>';
  h+='<div class="card" style="margin-top:14px"><div class="row between" style="margin-bottom:10px"><h2>Students</h2><div class="row" style="gap:6px"><button class="btn ghost sm" id="aiTest">Test Ekanthi Agent</button><button class="btn sm" id="addStu">+ Add student</button></div></div><div id="aiOut"></div>';
  if(T.newCreds) h+=credsCard(T.newCreds);
  if(T.adding){
    h+='<div class="card stack" style="background:#faf9f6;margin-bottom:12px"><div class="grid2"><div><label class="f">Full name</label><input id="nsName" type="text" maxlength="80"></div><div><label class="f">Class</label><select id="nsClass">'+d.classes.map(function(c){return '<option value="'+c.id+'">'+esc(c.board+" "+c.name)+'</option>';}).join("")+'</select></div><div><label class="f">Username (for login)</label><input id="nsUser" type="text" placeholder="e.g. arjun10" autocapitalize="none"></div><div><label class="f">PIN (leave empty = auto 6-digit)</label><input id="nsPin" type="tel" maxlength="6" inputmode="numeric"></div><div><label class="f">Language (explanations, voice, reports)</label><select id="nsLang">'+LANG_OPTS.map(function(o){return '<option value="'+o[0]+'">'+o[1]+'</option>';}).join("")+'</select></div><div><label class="f">Plan</label><select id="nsPlan"><option value="full">Full (paid)</option><option value="trial">Trial (limited)</option></select></div><div><label class="f">Access for</label><select id="nsDays"><option value="0">No end date</option><option value="3">3 days</option><option value="7">7 days</option><option value="30">1 month</option><option value="90">3 months</option><option value="180">6 months</option><option value="365">1 year</option></select></div><div><label class="f">Student WhatsApp (optional)</label><input id="nsPhone" type="tel" placeholder="e.g. 919876543210"></div><div><label class="f">Parent WhatsApp (optional)</label><input id="nsPPhone" type="tel" placeholder="with country code"></div></div><div class="row"><button class="btn sm" id="nsSave">Create student</button><button class="btn ghost sm" id="nsCancel">Cancel</button><span class="err" id="nsErr"></span></div></div>';
  }
  if(!st.length) h+='<div class="empty">No students yet. Click “Add student”.</div>';
  else{
    h+='<div class="scroll"><table><thead><tr><th>Student</th><th>Today</th><th>App</th><th>Streak</th><th>Quiz 7d</th><th>Homework</th><th>Practice 7d</th><th>Last mock</th><th>Last test</th><th>Chapters</th><th>Last active</th><th>Alerts</th></tr></thead><tbody>';
    st.forEach(function(s){
      var lt=s.lastTest? pct(s.lastTest.marks,s.lastTest.max) : null;
      h+='<tr class="click" data-sid="'+s.id+'"><td><b>'+esc(s.name)+'</b>'+(s.active?'':' <span class="pill p0">Paused</span>')+'<div class="muted small">'+esc(s.class_name||"")+' · '+esc(s.username)+(s.lang&&s.lang!=="ml"?' · <span class="pill p1">'+(s.lang==="hi"?"हिंदी":"English")+'</span>':'')+accBadge(s)+'</div></td>'+
        '<td>'+(s.todayMinutes? s.todayMinutes+' min' : '<span class="muted">—</span>')+(s.quizToday? '<div class="muted small">Quiz '+s.quizToday+'</div>':'')+'</td>'+
        '<td>'+(s.appToday? s.appToday+' min' : '<span class="muted">0</span>')+'<div class="muted small">7d '+(s.app7||0)+'m · '+(s.lastSeen?fmtDate(s.lastSeen):'never')+'</div></td>'+
        '<td>'+(s.streak? '<b>'+s.streak+'</b> day'+(s.streak>1?'s':'') : '<span class="muted">0</span>')+'</td>'+
        '<td>'+(s.quizAvg7===null? '<span class="muted">—</span>' : '<span class="pill '+(s.quizAvg7>=60?'good':s.quizAvg7>=40?'p1':'alert')+'">'+s.quizAvg7+'%</span>')+'</td>'+
        '<td>'+(s.hw&&s.hw.due? '<span class="pill '+(s.hw.overdue?'alert':s.hw.done>=s.hw.due?'good':'p1')+'">'+s.hw.done+'/'+s.hw.due+'</span>' : '<span class="muted">—</span>')+'</td>'+
        '<td>'+(s.practice7? s.practice7+(s.practice7>1?' tests':' test')+(s.practiceAvg7!==null?' <span class="muted small">('+s.practiceAvg7+'%)</span>':'') : '<span class="muted">—</span>')+'</td>'+
        '<td>'+(s.lastMock? s.lastMock.score+'/'+s.lastMock.total+' <span class="muted small">('+pct(s.lastMock.score,s.lastMock.total)+'%)</span>' : '<span class="muted">—</span>')+'</td>'+
        '<td>'+(lt===null? '<span class="muted">—</span>' : s.lastTest.marks+'/'+s.lastTest.max+' <span class="muted small">('+lt+'%)</span>')+'</td>'+
        '<td>'+s.chaptersDone+'/'+s.chaptersTotal+'</td>'+
        '<td>'+(s.lastActive? fmtDate(s.lastActive) : '<span class="muted">never</span>')+'</td>'+
        '<td>'+(s.alerts.length? s.alerts.map(function(a){return '<span class="pill alert">'+esc(a)+'</span>';}).join(" ") : '<span class="pill good">OK</span>')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  $("tMain").innerHTML=h+'</div>';
}
function credsCard(c){
  var msg="Ekanthi login 📚\nLink: "+SITE_URL+"\nUsername: "+c.username+"\nPIN: "+c.pin+(c.valid_until?"\n"+(c.plan==="trial"?"Trial":"Access")+" till: "+c.valid_until:"")+"\nAfter login, tap ▶ Help to see how to use the app.\n\n"+trL(c.lang,"PIN ആരോടും share ചെയ്യരുത്. മറ്റൊരു phone-ൽ login ചെയ്താൽ ഈ phone-ൽ നിന്ന് logout ആകും.","PIN किसी से share मत करना। दूसरे phone में login करने पर इस phone से logout हो जाएगा।","Do not share your PIN. Logging in on another phone logs out this one.");
  return '<div class="creds stack" style="margin-bottom:12px"><div><b>Login for '+esc(c.name||c.username)+'</b> — save or send now. The PIN is shown only once.</div><div>Username: <code>'+esc(c.username)+'</code> &nbsp; PIN: <code>'+esc(c.pin)+'</code></div><div class="row"><button class="btn sm" id="copyCreds" data-msg="'+esc(msg)+'">Copy message</button><a class="wa" target="_blank" rel="noopener" href="'+waLink(c.phone||"",msg)+'">Send on WhatsApp</a><button class="btn ghost sm" id="hideCreds">Done</button></div></div>';
}
$("tMain").addEventListener("click",function(e){
  var tr=e.target.closest("tr[data-sid]"); if(tr){ T.newCreds=null; T.dTab="dash"; tGo("detail", Number(tr.dataset.sid)); return; }
  var b=e.target.closest("button"); if(!b) return;
  var id=b.id;
  if(id==="addStu"){ T.adding=true; T.newCreds=null; renderOverview(); $("nsName").focus(); return; }
  if(id==="nsCancel"){ T.adding=false; renderOverview(); return; }
  if(id==="hideCreds"){ T.newCreds=null; T.view==="detail"? renderDetail() : renderOverview(); return; }
  if(id==="copyCreds"){ copy(b.dataset.msg); return; }
  if(id==="aiTest"){ $("aiOut").innerHTML='<div class="card" style="margin-bottom:10px"><span class="spinner"></span> Testing Ekanthi Agent…</div>';
    api("/api/admin/aitest").then(function(r){
      var rows=(r.trace||[]).map(function(x){ return '<tr><td class="small">'+esc(x.model)+'</td><td>'+(x.status===200?'<span class="pill good">OK</span>':x.status===429?'<span class="pill p1">Free limit reached</span>':'<span class="pill alert">'+esc(String(x.status||"error"))+'</span>')+'</td><td class="small">'+esc(x.status===200?'':x.message)+'</td></tr>'; }).join("");
      $("aiOut").innerHTML='<div class="card '+(r.ok?'good':'alert')+'" style="margin-bottom:10px">'+(r.ok? '✓ Ekanthi Agent working · '+r.ms+' ms<br>'+esc(r.text) : '✗ Ekanthi Agent not working'+(r.keySet?'':' · GEMINI_API_KEY missing')+'<br>'+esc(r.error))+(rows?'<table style="margin-top:8px;background:#fff;border-radius:8px"><thead><tr><th>Model</th><th>Result</th><th>Details</th></tr></thead><tbody>'+rows+'</tbody></table>':'')+'<div class="muted small" style="margin-top:6px">Backup (Workers AI): '+(r.workersAI?'connected ✓':'not connected')+'</div></div>'; })
    .catch(function(er){ $("aiOut").innerHTML='<div class="card alert">'+esc(er.message)+'</div>'; }); return; }
  if(id==="nsSave"){
    b.disabled=true; var nm=$("nsName").value.trim();
    api("/api/admin/student/create",{name:nm, class_id:Number($("nsClass").value), username:$("nsUser").value.trim(), pin:$("nsPin").value.trim(), lang:$("nsLang").value, plan:$("nsPlan").value, days:Number($("nsDays").value), phone:$("nsPhone").value, parent_phone:$("nsPPhone").value})
      .then(function(d){ T.adding=false; T.newCreds={name:nm, username:d.username, pin:d.pin}; loadOverview(); })
      .catch(function(er){ $("nsErr").textContent=er.message; b.disabled=false; });
    return;
  }
  if(T.view==="detail") detailClick(b, e);
  if(T.view==="classes") classClick(b, e);
  if(T.view==="study") studyClick(b, e);
  if(T.view==="homework") hwMgrClick(b, e);
  if(T.view==="plans") planClick(b, e);
  if(T.view==="teach") teachClick(b, e);
  if(T.view==="board") boardClick(b, e);
});
$("tMain").addEventListener("change",function(e){ if(T.view==="detail") detailChange(e); if(T.view==="classes") classChange(e); if(T.view==="study") studyChange(e); if(T.view==="homework") hwMgrChange(e); if(T.view==="plans") planChange(e); });
function copy(t){ (navigator.clipboard? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){toast("Copied");}).catch(function(){ prompt("Copy this:", t); }); }

function loadDetail(id){ loading(); api("/api/admin/student?id="+id).then(function(d){ T.detail=d; renderDetail(); }).catch(showErr); }
function renderDetail(){

  var min7=d.checkins.filter(function(c){return c.date>=addDays(t,-6);}).reduce(function(x,c){return x+(c.minutes||0);},0);
  var h='<div class="row between" style="margin-bottom:12px"><a href="#" id="backList">← All students</a><div class="row" style="gap:6px"><button class="btn ghost sm" data-a="reset">Reset PIN</button><button class="btn ghost sm" data-a="logout">Sign out devices</button><button class="btn ghost sm" data-a="toggle">'+(a.active?'Pause access':'Activate')+'</button><button class="btn danger sm" data-a="delete">Delete</button></div></div>';
  if(T.newCreds) h+=credsCard(T.newCreds);
  h+='<div class="card"><div class="row between"><div><h2 style="font-size:20px">'+esc(a.name)+(a.active?'':' <span class="pill p0">Paused</span>')+'</h2><div class="muted">'+esc(d.cls?d.cls.board+" "+d.cls.name:"")+' · username <b>'+esc(a.username)+'</b> · last login '+fmtDT(a.last_login)+'</div></div><div class="inline"><select data-ch="class">'+(T.overview?T.overview.classes:[]).map(function(c){return '<option value="'+c.id+'"'+(c.id===a.class_id?' selected':'')+'>'+esc(c.board+" "+c.name)+'</option>';}).join("")+'</select></div></div></div>';
  h+='<div class="kpis" style="margin-top:12px"><div class="card kpi"><h3>Streak</h3><b>'+d.streak+'</b></div><div class="card kpi"><h3>Study (7 days)</h3><b>'+min7+' min</b></div><div class="card kpi"><h3>Quiz avg (7 days)</h3><b>'+(qa===null?'—':qa+'%')+'</b></div><div class="card kpi"><h3>Chapters done</h3><b>'+done+'/'+d.chapters.length+'</b></div></div>';
  var tabs=[["dash","Dashboard"],["report","Report / Parents"],["usage","App usage"],["activity","Activity"],["chapters","Chapters"],["tests","Tests & marks"],["mocks","Mock exams"],["study","Study"],["quizzes","Quizzes & practice"],["chats","Agent chats"],["logins","Logins"]];
  h+='<div class="subtabs" style="margin:16px 0 12px">'+tabs.map(function(x){return '<button data-dt="'+x[0]+'" class="'+(T.dTab===x[0]?'on':'')+'">'+x[1]+'</button>';}).join("")+'</div>';
  var body='';
  if(T.dTab==="activity"){
    var byDay={}; d.checkins.forEach(function(c){ (byDay[c.date]=byDay[c.date]||{m:0,n:0}).m+=c.minutes||0; byDay[c.date].n++; });
    var qByDay={}; d.quizzes.forEach(function(q){ if(q.completed_at) qByDay[q.date]=q; });
    var start=addDays(t,-27), dow=(new Date(start+"T00:00:00Z").getUTCDay()+6)%7; start=addDays(start,-dow);
    var cal=''; ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(x){cal+='<div style="background:none;min-height:0;padding:0 6px" class="muted small">'+x+'</div>';});
    for(var i=0;i<35;i++){ var dd=addDays(start,i); if(dd>t){ cal+='<div class="fut"></div>'; continue; } var m=(byDay[dd]||{}).m||0, q=qByDay[dd]; var lv=m>=60?3:m>=30?2:(m>0||q)?1:0;

  }
  if(T.dTab==="chapters"){
    d.subjects.forEach(function(s){
      var ch=d.chapters.filter(function(c){return c.subject_id===s.id;});
      body+='<div class="card" style="margin-bottom:12px"><h2 style="margin-bottom:8px">'+esc(s.name)+'</h2>'+(ch.length? '<table><thead><tr><th>Chapter</th><th>Priority</th><th>Week</th><th>Status</th></tr></thead><tbody>'+ch.map(function(c){ var late=d.week&&c.week&&c.week<d.week&&c.status<2; return '<tr><td>'+esc(c.name)+(late?' <span class="pill alert">behind</span>':'')+'</td><td><span class="pill pr-'+c.priority+'">'+c.priority+'</span></td><td class="muted">'+(c.week?'W'+c.week:'—')+'</td><td class="inline"><select data-ch="status" data-id="'+c.id+'">'+STATUS.map(function(x,i){return '<option value="'+i+'"'+(i===c.status?' selected':'')+'>'+x+'</option>';}).join("")+'</select></td></tr>'; }).join("")+'</tbody></table>' : '<div class="muted">No chapters. Add them in Classes.</div>')+'</div>';
    });

  if(T.dTab==="tests"){

  }
  if(T.dTab==="dash"){
    var mo=d.monitor||{alerts:[],subjects:[],usage:[],focus:[],flags:[],badges:[]};
    var first=a.name.split(" ")[0];

    var al_=mo.alerts.length? mo.alerts.slice(0,3).map(function(x){return "• "+x.text;}).join("\n") : null, g_=(mo.goal||45);
    var parentMsg=trL(mo.lang, "നമസ്കാരം 🙏 "+a.name+"-ന്റെ പഠനത്തെക്കുറിച്ച്:\n"+(al_||"നന്നായി പോകുന്നു.")+"\nദിവസവും "+g_+" മിനിറ്റ് പഠിക്കാൻ വീട്ടിൽ ഒന്ന് ശ്രദ്ധിക്കാമോ? — JP", "नमस्ते 🙏 "+a.name+" की पढ़ाई के बारे में:\n"+(al_||"अच्छा चल रहा है।")+"\nकृपया घर पर रोज़ "+g_+" मिनट पढ़ाई पर ध्यान दें। — JP", "Hello 🙏 About "+a.name+"'s studies:\n"+(al_||"Going well.")+"\nPlease make sure they study "+g_+" minutes every day at home. — JP");
    body+='<div class="grid2"><div class="card stack"><div class="row between"><h3>Delays & alerts</h3><span class="muted small">'+mo.alerts.length+'</span></div>'+(mo.alerts.length? mo.alerts.map(function(x){return '<div class="al '+x.level+'">'+(x.level==="red"?'🔴':'🟠')+' <span>'+esc(x.text)+'</span></div>';}).join("") : '<div class="al" style="background:var(--okbg);color:#145c37">✅ No delays — on track</div>')+

function detailClick(b){
  var d=T.detail, a=d.account;
  if(b.dataset.dt){ T.dTab=b.dataset.dt; renderDetail(); return; }
  var act=b.dataset.a; if(!act && !b.dataset.adjsave) return;
  if(act==="reset"){ if(!confirm("Make a new PIN for "+a.name+"? The old PIN stops working and they are signed out.")) return; api("/api/admin/student/update",{id:a.id, reset_pin:true}).then(function(r){ T.newCreds={name:a.name, username:r.username, pin:r.pin}; renderDetail(); window.scrollTo(0,0); }).catch(function(e){toast(e.message);}); }
  if(act==="logout"){ api("/api/admin/student/update",{id:a.id, logout:true}).then(function(){ toast("Signed out from all devices"); }).catch(function(e){toast(e.message);}); }
  if(act==="toggle"){ api("/api/admin/student/update",{id:a.id, active:!a.active}).then(function(){ toast(a.active?"Access paused":"Activated"); loadDetail(a.id); }).catch(function(e){toast(e.message);}); }
  if(act==="delete"){ if(prompt("This deletes "+a.name+" and ALL their data. Type DELETE to confirm.")!=="DELETE") return; api("/api/admin/student/delete",{id:a.id}).then(function(){ toast("Deleted"); tGo("students"); }).catch(function(e){toast(e.message);}); }
  if(b.dataset.adjsave){ var n=b.dataset.adjsave, box=b.closest("[data-mockid]"), mid=Number(box.dataset.mockid);
    var mv=box.querySelector('[data-adj="'+n+'"]').value, note=box.querySelector('[data-adjnote="'+n+'"]').value;
    b.disabled=true; api("/api/admin/mock/adjust",{id:mid, n:Number(n), marks:mv, note:note}).then(function(r){ toast("Saved · new total "+r.score); loadDetail(a.id); }).catch(function(er){ toast(er.message); b.disabled=false; }); return; }
  if(act==="ext"){ api("/api/admin/student/update",{id:a.id, extend_days:Number(b.dataset.d)}).then(function(r){ toast(r.valid_until?"Access till "+r.valid_until:"No end date"); loadDetail(a.id); }); return; }
  if(act==="push"){ var msg=prompt("Notification to "+a.name+" (shows on their phone):", "Hi "+a.name.split(" ")[0]+", please finish today's work on Ekanthi 💪"); if(!msg) return; api("/api/admin/push",{student_id:a.id, title:"📢 From your tutor", body:msg}).then(function(r){ toast(r.sent? "Sent to "+r.sent+" device(s)" : "Not delivered — student's notifications are off"); }); return; }
  if(act==="phones"){ api("/api/admin/student/update",{id:a.id, phone:$("phIn").value, parent_phone:$("pphIn").value}).then(function(){ toast("WhatsApp numbers saved"); loadDetail(a.id); }); return; }
  if(act==="plan"){ api("/api/admin/student/update",{id:a.id, plan:a.plan==="trial"?"full":"trial"}).then(function(){ toast("Plan updated"); loadDetail(a.id); }); return; }
  if(act==="lang"){ api("/api/admin/student/lang",{id:a.id, lang:$("langIn").value}).then(function(){ toast("Language saved — new answers, notes and reports will use it"); loadDetail(a.id); }); return; }
  if(act==="goal"){ api("/api/admin/student/goal",{id:a.id, daily_min:$("goalIn").value}).then(function(){ toast("Goal saved"); loadDetail(a.id); }); return; }
  if(act==="addtest"){ b.disabled=true; api("/api/admin/test/add",{student_id:a.id, subject_id:Number($("tsSubj").value), date:$("tsDate").value, title:$("tsTitle").value, marks:$("tsMarks").value, max_marks:$("tsMax").value, note:$("tsNote").value}).then(function(){ toast("Marks saved"); loadDetail(a.id); }).catch(function(e){ $("tsErr").textContent=e.message; b.disabled=false; }); }
  if(act==="deltest"){ if(!confirm("Delete this test entry?")) return; api("/api/admin/test/delete",{id:Number(b.dataset.id)}).then(function(){ loadDetail(a.id); }); }
}

function fileToB64(file){

  if(file.size>6.5*1048576) return Promise.reject(new Error(file.name+" is larger than 6 MB. Put it on Google Drive and add the link."));

function hwMgrClick(b){
  var a=b.dataset.hm;

  if(b.dataset.hsubj){ keep(); HM.f.subject_id=Number(b.dataset.hsubj); HM.f.chapters=[]; renderHwMgr(); return; }
  if(b.dataset.hch){ keep(); var id=Number(b.dataset.hch), i=HM.f.chapters.indexOf(id); if(i>=0) HM.f.chapters.splice(i,1); else if(HM.f.chapters.length<(HM.f.kind==="mock"?15:6)) HM.f.chapters.push(id); renderHwMgr(); return; }
  if(b.dataset.hsid){ keep(); var sid=Number(b.dataset.hsid), j=HM.f.sids.indexOf(sid); if(j>=0) HM.f.sids.splice(j,1); else HM.f.sids.push(sid); renderHwMgr(); return; }
  if(a==="new"){ HM.form=true; HM.f={}; renderHwMgr(); return; }
  if(a==="cancel"){ HM.form=false; renderHwMgr(); return; }
  if(a==="del"){ if(confirm("Remove this homework for all students?")) api("/api/admin/homework/delete",{id:Number(b.dataset.id)}).then(loadHwMgr); return; }
  if(a==="create"){ keep(); var f=HM.f;
    var body={class_id:f.class_id, kind:f.kind, title:f.title, instructions:f.instr, due_date:f.due, time_limit:f.time, subject_id:f.subject_id, chapter_ids:f.chapters, n:f.n|| (f.kind==="mcq"?10:5), mock_kind:f.mock_kind, max_marks:f.max, student_ids: f.who==="some"? f.sids : []};

    api("/api/admin/homework/create",body).then(function(){ toast("Homework assigned"); HM.form=false; loadHwMgr(); }).catch(function(er){ $("hfErr").textContent=er.status===429?"Ekanthi Agent is busy. Try again in a minute.":er.message; b.disabled=false; b.textContent="Create & assign"; }); return; }

  if(a==="back"){ if(HM.sub){ HM.sub=null; } else { HM.detail=null; } renderHwMgr(); return; }
  if(a==="photo"){ var box=b.parentNode.querySelector("[data-photobox]"); fetchSubFile(Number(b.dataset.id)).then(function(f){ box.innerHTML+='<img class="full" src="'+f.url+'" style="max-height:700px;object-fit:contain;width:100%;margin-top:8px;border-radius:10px;border:1px solid var(--line)">'; b.remove(); }).catch(function(er){toast(er.message);}); return; }
  if(a==="aicheck"){ b.disabled=true; b.innerHTML='<span class="spinner"></span> Checking…'; api("/api/admin/submission/aicheck",{id:HM.sub.submission.id}).then(function(r){ $("rvScore").value=r.score; $("rvTotal").value=r.total; $("rvFb").value=r.feedback; b.disabled=false; b.textContent="✨ Agent check again"; toast("Ekanthi Agent suggestion filled — edit and Save"); }).catch(function(er){ toast(er.status===429?"Ekanthi Agent is busy":er.message); b.disabled=false; b.textContent="✨ Agent check"; }); return; }
  if(a==="save"){ var sb=HM.sub, body2={id:sb.submission.id, feedback:$("rvFb").value};
    if(sb.kind==="written"){ body2.grades=[].slice.call(document.querySelectorAll("[data-rvq]")).map(function(x){return {n:Number(x.dataset.rvq), marks:x.value};}); }
    else if(sb.kind==="task"){ body2.score=$("rvScore").value; body2.total=$("rvTotal").value; }
    api("/api/admin/submission/review",body2).then(function(){ toast("Saved"); HM.sub=null; openHwDetail(HM.detail.assignment.id); }).catch(function(er){toast(er.message);}); return; }
  if(a==="reopen"){ if(confirm("Let the student do this again? Their submission will be reopened.")) api("/api/admin/submission/reopen",{id:HM.sub.submission.id}).then(function(){ HM.sub=null; openHwDetail(HM.detail.assignment.id); }); return; }

  h+='<div><label class="f">For</label><div class="chips"><button class="chip'+(f.who==="all"?' on':'')+'" data-pfwho="all">Whole class ('+studs.length+')</button><button class="chip'+(f.who==="some"?' on':'')+'" data-pfwho="some">Selected students</button></div>'+(f.who==="some"? '<div class="chips" style="margin-top:6px">'+studs.map(function(x){return '<button class="chip'+(f.sids.indexOf(x.id)>=0?' on':'')+'" data-pfsid="'+x.id+'">'+esc(x.name)+'</button>';}).join("")+'</div>' : '')+'</div>';
  h+='<div><label class="f">Subjects, exam dates and chapters</label>'+(c.subjects.length? c.subjects.map(function(s){ var on=f.subj[s.id], sel=f.chs[s.id]; return '<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff"><div class="row between"><label class="row" style="gap:8px"><input type="checkbox" data-pfsubj="'+s.id+'"'+(on?' checked':'')+'><b>'+esc(s.name)+'</b> <span class="muted small">'+s.chapters.length+' chapters</span></label><div class="row small">Exam date <input type="date" data-pfexam="'+s.id+'" value="'+esc(f.exams[s.id]||"")+'" style="width:auto"></div></div>'+
      (on? '<div class="small" style="margin-top:6px">Chapters: <b>'+(sel? sel.length+' selected':'all')+'</b> <button class="btn ghost sm" data-pfchs="'+s.id+'">'+(sel?'Use all':'Choose chapters')+'</button></div>'+(sel? '<div class="chips" style="margin-top:6px">'+s.chapters.map(function(ch){return '<button class="chip'+(sel.indexOf(ch.id)>=0?' on':'')+'" data-pfch="'+ch.id+'" data-s="'+s.id+'">'+esc(ch.name)+'</button>';}).join("")+'</div>' : '') : '')+'</div>'; }).join("") : '<div class="muted">This class has no subjects. Add them in Classes (or Load NCERT syllabus).</div>')+'</div>';
  h+='<div class="row"><button class="btn ghost sm" data-pm="preview">Preview plan</button><button class="btn sm" data-pm="create">Create plan</button><button class="btn ghost sm" data-pm="cancel">Cancel</button><span class="err" id="pfErr"></span></div>';
  if(PM.preview) h+=planPreviewHtml(PM.preview, c);
  return h+'</div>';
}
function planBody(){
  var f=PM.f, c=pmClass();
  return {class_id:f.class_id, title:f.title, start_date:f.start, per_day:f.per, rev_days:f.rev, off_days:f.off, student_ids:f.who==="some"?f.sids:[],
    subjects:c.subjects.filter(function(s){return f.subj[s.id] && f.exams[s.id];}).map(function(s){ return {id:s.id, exam:f.exams[s.id], chapter_ids:f.chs[s.id]||[]}; })};
}
function planWeeksHtml(items, subs, todayStr, limitDays){
  var col={}; (subs||[]).forEach(function(s){col[s.id]=s;});
  var g={}; items.forEach(function(i){ if(limitDays && i.date>addDays(todayStr,limitDays)) return; (g[i.date]=g[i.date]||[]).push(i); });
  return Object.keys(g).sort().map(function(dt){ return '<div class="pl-row"'+(dt===todayStr?' style="background:#f3f7fb"':'')+'><div class="pl-date">'+DOW[new Date(dt+"T00:00:00Z").getUTCDay()]+' '+fmtDate(dt)+'</div><div>'+g[dt].map(function(i){ var s=col[i.subject_id]||{}; return '<span class="pl-item '+i.kind+'" style="border-left-color:'+esc(s.color||"#2b6aa3")+'"><b>'+esc(s.name||"")+'</b> '+esc(i.note.replace(new RegExp("^"+(s.name||"x")+":\\s*"),""))+'</span>'; }).join("")+'</div></div>'; }).join("");
}
function planPreviewHtml(p, c){
  var learn=p.items.filter(function(i){return i.kind==="learn";}).length, rev=p.items.filter(function(i){return i.kind==="revise";}).length, mock=p.items.filter(function(i){return i.kind==="mock";}).length;
  return '<div class="card stack" style="margin-top:8px"><div class="row between"><h3>Preview</h3><span class="muted small">'+learn+' study · '+rev+' revision · '+mock+' mock days · ends '+fmtDate(p.end)+'</span></div>'+(p.warnings.length? p.warnings.map(function(w){return '<div class="al amber">⚠️ '+esc(w)+'</div>';}).join("") : '')+'<div style="max-height:420px;overflow:auto">'+planWeeksHtml(p.items, c.subjects, PM.list.today, 0)+'</div></div>';
}
function planChange(e){
  var el=e.target;
  if(el.dataset.pf){ grabPlanForm(); var k=el.dataset.pf; PM.f[k]= k==="class_id"||k==="per"||k==="rev" ? Number(el.value) : el.value; PM.preview=null; renderPlans(); return; }
  if(el.dataset.pfsubj){ grabPlanForm(); PM.f.subj[el.dataset.pfsubj]=el.checked; PM.preview=null; renderPlans(); return; }
  if(el.dataset.pfexam){ PM.f.exams[el.dataset.pfexam]=el.value; PM.preview=null; }
}
function planClick(b){
  var a=b.dataset.pm, f=PM.f;
  if(b.dataset.pfoff){ grabPlanForm(); var d=Number(b.dataset.pfoff), i=f.off.indexOf(d); if(i>=0) f.off.splice(i,1); else if(f.off.length<5) f.off.push(d); PM.preview=null; renderPlans(); return; }
  if(b.dataset.pfwho){ grabPlanForm(); f.who=b.dataset.pfwho; renderPlans(); return; }
  if(b.dataset.pfsid){ grabPlanForm(); var sid=Number(b.dataset.pfsid), j=f.sids.indexOf(sid); if(j>=0) f.sids.splice(j,1); else f.sids.push(sid); renderPlans(); return; }
  if(b.dataset.pfchs){ grabPlanForm(); var s=b.dataset.pfchs; f.chs[s]= f.chs[s]? null : []; PM.preview=null; renderPlans(); return; }
  if(b.dataset.pfch){ grabPlanForm(); var arr=f.chs[b.dataset.s], id=Number(b.dataset.pfch), k=arr.indexOf(id); if(k>=0) arr.splice(k,1); else arr.push(id); PM.preview=null; renderPlans(); return; }
  if(a==="new"){ PM.form=true; PM.f={}; PM.preview=null; renderPlans(); return; }
  if(a==="cancel"){ PM.form=false; PM.preview=null; renderPlans(); return; }
  if(a==="del"){ if(confirm("Delete this exam plan?")) api("/api/admin/plan/delete",{id:Number(b.dataset.id)}).then(loadPlans); return; }
  if(a==="preview"||a==="create"){ grabPlanForm(); var body=planBody();
    if(!body.subjects.length){ $("pfErr").textContent="Tick at least one subject and set its exam date"; return; }
    if(f.who==="some" && !f.sids.length){ $("pfErr").textContent="Choose students"; return; }
    b.disabled=true;
    api(a==="preview"?"/api/admin/plan/preview":"/api/admin/plan/create", body).then(function(r){
      if(a==="preview"){ PM.preview=r; renderPlans(); return; }
      toast("Exam plan created"+(r.warnings.length?" (see notes)":"")); PM.form=false; PM.preview=null; loadPlans();
    }).catch(function(er){ $("pfErr").textContent=er.message; b.disabled=false; }); return; }
}
function renderPlanDetail(){
  var d=PM.detail, p=d.plan;
  var h='<a href="#" data-pmback="1">← All exam plans</a><div class="card stack" style="margin-top:10px"><div class="row between"><h2 style="font-size:19px">'+esc(p.title)+'</h2><span class="muted">'+fmtDate(p.start_date)+' → '+fmtDate(p.end_date)+'</span></div>'+(p.warnings.length? p.warnings.map(function(w){return '<div class="al amber">⚠️ '+esc(w)+'</div>';}).join("") : '')+'</div>';
  h+='<div class="card" style="margin-top:12px"><h3 style="margin-bottom:8px">Students on this plan</h3>'+(d.students.length? '<table><thead><tr><th>Student</th><th>Done</th><th>Due so far</th><th>Behind</th><th>Pending items</th></tr></thead><tbody>'+d.students.map(function(x){ return '<tr><td><b>'+esc(x.name)+'</b></td><td>'+x.done+'/'+x.total+'<div class="bar" style="width:120px;margin-top:4px"><span style="width:'+pct(x.done,x.total)+'%;background:var(--ok)"></span></div></td><td>'+x.due+'</td><td>'+(x.behind?'<span class="pill '+(x.behind>=5?'alert':'p1')+'">'+x.behind+'</span>':'<span class="pill good">on track</span>')+'</td><td class="small">'+esc(x.behindItems.slice(0,3).join(" · "))+'</td></tr>'; }).join("")+'</tbody></table>' : '<div class="muted">No students in this class yet.</div>')+'</div>';
  h+='<div class="card" style="margin-top:12px"><div class="row between" style="margin-bottom:6px"><h3>Day-by-day plan</h3><span class="muted small">Students tick items on their Today page; a study check-in on a chapter ticks it automatically.</span></div>'+planWeeksHtml(d.items, d.subjects, d.today, 0)+'</div>';
  $("tMain").innerHTML=h;
  var cur=document.querySelector('.pl-row[style]'); if(cur) cur.scrollIntoView({block:"center"});
}
$("tMain").addEventListener("click",function(e){
  if(T.view!=="plans") return;
  if(e.target.closest("[data-pmback]")){ e.preventDefault(); PM.detail=null; loadPlans(); return; }
  if(e.target.closest("button")) return;
  var tr=e.target.closest("tr[data-pid]"); if(tr){ loading(); api("/api/admin/plan?id="+tr.dataset.pid).then(function(d){ PM.detail=d; renderPlanDetail(); window.scrollTo(0,0); }).catch(showErr); }
});

function startTutor(){ show("tutor"); tGo("students"); }

// ===================== START =====================
function start(){ var rp=(location.search.match(/[?&]r=([a-f0-9]{40})/)||[])[1]; if(rp) return startReport(rp); if(!token) return show("login"); if(role==="tutor") startTutor(); else startStudent(); }
start();
})();
</script>
</body>
</html>
